  <text x="100" y="300" font-family="Inter, sans-serif" font-size="96" font-weight="800" fill="oklch(0.94 0.004 260)" letter-spacing="-3">Textkiln</text>
  <text x="100" y="380" font-family="Inter, sans-serif" font-size="36" font-weight="500" fill="oklch(0.62 0.012 260)">43 text tools, one page, nothing uploaded.</text>
